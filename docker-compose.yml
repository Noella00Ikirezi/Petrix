services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: grc-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-REMOVED_SECRET}
      POSTGRES_DB: ${POSTGRES_DB:-grc_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grc}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching and Celery
  redis:
    image: redis:7-alpine
    container_name: grc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grc-backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-grc}:${POSTGRES_PASSWORD:-REMOVED_SECRET}@db:5432/${POSTGRES_DB:-grc_platform}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-REMOVED_SECRET}
      - DEBUG=${DEBUG:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grc-celery
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-grc}:${POSTGRES_PASSWORD:-REMOVED_SECRET}@db:5432/${POSTGRES_DB:-grc_platform}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    command: celery -A app.workers worker --loglevel=info

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grc-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    command: npm run dev -- --host

  # Ollama - 100% Open Source LLM Server
  ollama:
    image: ollama/ollama:latest
    container_name: grc-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # Pour Mac/CPU, le bloc deploy est commenté ci-dessus

  # MinIO - S3-compatible object storage (European alternative)
  minio:
    image: minio/minio:latest
    container_name: grc-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-REMOVED_SECRET}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-REMOVED_SECRET}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
