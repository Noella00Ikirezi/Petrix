# Discovery Audit - Configuration par défaut
# Ce fichier peut être personnalisé pour chaque audit

# Général
name: "Discovery Audit"
output_dir: "./reports"

# Phases activées
enable_network_scan: true
enable_system_audit: true
enable_web_audit: true
enable_vuln_scan: true

# Configuration du scan réseau
network:
  # Ports à scanner (1-1000, full, ou liste: 22,80,443)
  ports: "1-1000"
  # Scanner les ports UDP (plus lent)
  scan_udp: false
  # Mode agressif (détection OS, scripts avancés)
  aggressive: false

# Timeouts (en secondes)
timeouts:
  per_host: 300  # 5 minutes par hôte
  total: 3600    # 1 heure total

# Parallélisme
concurrency:
  max_hosts: 10
  max_checks: 50

# Génération de rapports
reports:
  generate_pdf: true
  generate_html: true
  generate_json: true

# Credentials SSH pour audit système distant (optionnel)
# ssh:
#   user: admin
#   key_path: ~/.ssh/id_rsa
#   password: null  # Non recommandé

# Exclusions
exclude:
  hosts: []
  ports: []

# Scripts personnalisés à exécuter
custom_scripts: []

# Seuils de scoring personnalisés (optionnel)
scoring:
  # Poids des sévérités (impact sur le score)
  severity_weights:
    critical: 40
    high: 25
    medium: 10
    low: 3
    info: 0

  # Seuils pour les grades
  grade_thresholds:
    A: 90
    B: 75
    C: 60
    D: 40
    F: 0
