[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discovery-audit"
version = "0.2.0"
description = "Cross-platform security audit tool with hybrid architecture - Network scanning, vulnerability detection, compliance checking"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "Afluens", email = "nikirezi@afluens.fr"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "python-nmap>=0.7.1",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
    "requests>=2.31.0",

    # Remote execution
    "paramiko>=3.4.0",
    "pywinrm>=0.4.3",

    # Server/API
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.26.0",

    # Database (for BloodHound integration)
    "neo4j>=5.15.0",

    # Reporting
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "weasyprint>=60.0",
    "matplotlib>=3.8.0",
    "networkx>=3.2.0",

    # LDAP/AD
    "ldap3>=2.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

# Optional integrations (install separately if needed)
metasploit = [
    "pymetasploit3>=1.0.3",
]

windows = [
    "wmi>=1.5.1; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]

all = [
    "discovery-audit[metasploit,windows]",
]

[project.scripts]
discovery-audit = "discovery_audit.cli:main"
da-server = "discovery_audit.server.api:main"
da-agent = "discovery_audit.agent.daemon:run_daemon"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
