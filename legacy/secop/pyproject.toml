[project]
name = "secop-audit"
version = "1.0.0"
description = "Outil d'audit securite et infrastructure pour PME"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [
    {name = "SecOp Team"}
]
keywords = ["security", "audit", "infrastructure", "vulnerability", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    # Core
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "bcrypt>=4.1",

    # UI
    "ttkbootstrap>=1.10",
    "matplotlib>=3.8",
    "pillow>=10.0",

    # Scanners
    "python-nmap>=0.7",
    "python-gvm>=24.0",

    # Directory Services
    "ldap3>=2.9",
    "ms-active-directory>=1.12",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",

    # Reports
    "reportlab>=4.0",
    "jinja2>=3.1",

    # Utils
    "schedule>=1.2",
    "netifaces>=0.11",
    "mac-vendor-lookup>=0.1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.2",
    "mypy>=1.8",
]

[project.scripts]
secop = "secop.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src/secop --cov-report=term-missing"
