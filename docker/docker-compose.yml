services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: petrix-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-petrix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: petrix-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend (hot reload)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: petrix-backend:dev
    container_name: petrix-backend
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-petrix}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM_EMAIL=noreply@petrix.local
      - SMTP_TLS=false
      - DEBUG=true
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker
  celery:
    image: petrix-backend:dev
    container_name: petrix-celery
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-petrix}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM_EMAIL=noreply@petrix.local
      - SMTP_TLS=false
    volumes:
      - ../backend:/app
    depends_on:
      - backend
      - redis
    user: root
    cap_add:
      - NET_RAW
      - NET_ADMIN
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  # React Frontend (Vite HMR)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: petrix-frontend:dev
    container_name: petrix-frontend
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    command: npm run dev -- --host

  # MinIO — S3-compatible local storage
  minio:
    image: minio/minio:latest
    container_name: petrix-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"    # MinIO Console
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailpit — email catcher (OTP visible à http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    container_name: petrix-mailpit
    ports:
      - "8025:8025"    # Web UI
      - "1025:1025"    # SMTP

  # Adminer — SQL browser (http://localhost:8080)
  adminer:
    image: adminer:latest
    container_name: petrix-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    depends_on:
      - db

volumes:
  postgres_data:
  redis_data:
  minio_data:
