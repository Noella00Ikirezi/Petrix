server {
    listen 80;
    server_name _;

    # Docker DNS resolver — force re-resolution on each request
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # WebSocket temps réel (surveillance continue — agents + dashboard). Préfixe plus
    # spécifique que /api/ ci-dessous, donc prioritaire (longest-prefix match nginx).
    # proxy_read_timeout élevé : ces connexions restent ouvertes en continu (heartbeat
    # agent toutes les 30s), contrairement aux requêtes HTTP classiques de /api/.
    location /api/v1/hardening/ws/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_connect_timeout 300;
    }

    # API backend
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        client_max_body_size 50M;
    }

    # Docs Swagger
    location /docs {
        set $backend http://backend:8000;
        proxy_pass $backend/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        set $backend http://backend:8000;
        proxy_pass $backend/openapi.json;
        proxy_set_header Host $host;
    }

    # Frontend (build statique nginx — pas de source maps)
    location / {
        set $frontend http://frontend:80;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
