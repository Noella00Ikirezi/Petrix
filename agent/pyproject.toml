[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "petrix-agent"
version = "0.1.0"
description = "Agent réseau local Petrix — découverte, ports, CVEs, hardening"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24",
    "python-nmap>=0.7",
    "rich>=13.0",
    "click>=8.0",
    "netifaces>=0.11",
]

[project.optional-dependencies]
scapy = ["scapy>=2.5"]

[project.scripts]
petrix-agent = "petrix_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["petrix_agent*"]
