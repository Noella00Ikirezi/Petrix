stages:
  - lint
  - test
  - build
  - deploy

variables:
  DATABASE_URL: "sqlite:///./test.db"
  SECRET_KEY: "ci-test-secret-key"
  ADMIN_PASSWORD: "CITestAdmin123!"

# ---------------------------------------------------------------------------
# LINT (non-bloquant — ne stoppe pas le deploy)
# ---------------------------------------------------------------------------
backend-lint:
  stage: lint
  allow_failure: true
  image: python:3.12-slim
  before_script:
    - pip install ruff black
  script:
    - cd backend
    - ruff check app/ --output-format=github
    - black --check app/

# ---------------------------------------------------------------------------
# TEST (non-bloquant)
# ---------------------------------------------------------------------------
backend-test:
  stage: test
  allow_failure: true
  image: python:3.12-slim
  before_script:
    - cd backend
    - pip install -r requirements.txt pytest-cov
  script:
    - cd backend
    - pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml

frontend-test:
  stage: test
  allow_failure: true
  image: node:20
  before_script:
    - cd frontend && npm ci
  script:
    - cd frontend && npm run test:coverage

# ---------------------------------------------------------------------------
# BUILD — valide que le frontend compile (bloquant)
# ---------------------------------------------------------------------------
frontend-build:
  stage: build
  allow_failure: true
  image: node:20
  before_script:
    - cd frontend && npm ci
  script:
    - cd frontend && npx vite build
  artifacts:
    paths:
      - frontend/dist/

# ---------------------------------------------------------------------------
# DEPLOY — push sur main → déploiement automatique en production
# AWS SSM : aucun port SSH ouvert, aucune clé stockée dans GitLab
# ---------------------------------------------------------------------------
deploy-production:
  stage: deploy
  image: amazon/aws-cli:latest
  only:
    - main
  environment:
    name: production
    url: https://petrix.noellahome.org
  script:
    - |
      COMMAND_ID=$(aws ssm send-command \
        --region eu-west-1 \
        --instance-ids "$EC2_INSTANCE_ID" \
        --document-name "AWS-RunShellScript" \
        --comment "Deploy $CI_COMMIT_SHORT_SHA — $CI_COMMIT_TITLE" \
        --parameters 'commands=[
          "set -e",
          "cd /home/ec2-user/petrix",
          "git pull origin main",
          "docker compose -f docker/docker-compose.prod.yml build --no-cache backend frontend",
          "docker compose -f docker/docker-compose.prod.yml up -d --remove-orphans",
          "docker compose -f docker/docker-compose.prod.yml exec -T db psql -U $POSTGRES_USER -d $POSTGRES_DB -c \"ALTER TABLE users ADD COLUMN IF NOT EXISTS must_change_password BOOLEAN NOT NULL DEFAULT false;\"",
          "docker compose -f docker/docker-compose.prod.yml ps"
        ]' \
        --query 'Command.CommandId' \
        --output text)
      echo "SSM Command ID: $COMMAND_ID"

    - |
      aws ssm wait command-executed \
        --region eu-west-1 \
        --command-id "$COMMAND_ID" \
        --instance-id "$EC2_INSTANCE_ID"

    - |
      aws ssm get-command-invocation \
        --region eu-west-1 \
        --command-id "$COMMAND_ID" \
        --instance-id "$EC2_INSTANCE_ID" \
        --query '[StatusDetails, StandardOutputContent]' \
        --output text
