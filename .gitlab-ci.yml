stages:
  - lint
  - test
  - build
  - deploy

variables:
  DATABASE_URL: "sqlite:///./test.db"
  SECRET_KEY: "ci-test-secret-key"
  ADMIN_PASSWORD: "CITestAdmin123!"

# ---------------------------------------------------------------------------
# LINT — non-bloquant, informatif uniquement
# ---------------------------------------------------------------------------
backend-lint:
  stage: lint
  allow_failure: true
  image: python:3.12-slim
  before_script:
    - pip install ruff black
  script:
    - cd backend
    - ruff check app/ --output-format=github
    - black --check app/

# ---------------------------------------------------------------------------
# TEST — non-bloquant
# ---------------------------------------------------------------------------
backend-test:
  stage: test
  allow_failure: true
  image: python:3.12-slim
  before_script:
    - cd backend
    - pip install -r requirements.txt pytest-cov
  script:
    - cd backend
    - pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml

frontend-test:
  stage: test
  allow_failure: true
  image: node:20
  before_script:
    - cd frontend && npm ci
  script:
    - cd frontend && npm run test:coverage

# ---------------------------------------------------------------------------
# BUILD — valide que le frontend compile
# ---------------------------------------------------------------------------
frontend-build:
  stage: build
  allow_failure: true
  image: node:20
  before_script:
    - cd frontend && npm ci
  script:
    - cd frontend && npx vite build
  artifacts:
    paths:
      - frontend/dist/

# ---------------------------------------------------------------------------
# DEPLOY — MANUEL UNIQUEMENT (bouton "Run" dans GitLab → Pipelines → ▶)
# Ne se déclenche JAMAIS automatiquement.
# Variables GitLab CI requises : AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
#   AWS_DEFAULT_REGION, EC2_INSTANCE_ID, S3_BUCKET
# ---------------------------------------------------------------------------
deploy-production:
  stage: deploy
  image: node:20
  when: manual
  allow_failure: false
  environment:
    name: production
    url: https://petrix.noellahome.org
  script:
    # 1. Build frontend
    - cd frontend && npm ci --silent && npx vite build && cd ..
    - tar -czf /tmp/frontend-dist.tar.gz frontend/dist/

    # 2. Installer AWS CLI
    - apt-get update -qq && apt-get install -y -qq awscli

    # 3. Upload frontend + fichiers backend modifiés vers S3
    - aws s3 cp /tmp/frontend-dist.tar.gz s3://$S3_BUCKET/deploy/frontend-dist.tar.gz
    - aws s3 cp backend/app/api/v1/scans.py       s3://$S3_BUCKET/deploy/scans.py
    - aws s3 cp backend/app/workers/scan_tasks.py s3://$S3_BUCKET/deploy/scan_tasks.py
    - aws s3 cp backend/app/api/v1/agent_download.py s3://$S3_BUCKET/deploy/agent_download.py
    - aws s3 cp agent/petrix_agent/reporter.py    s3://$S3_BUCKET/deploy/reporter.py

    # 4. Déclencher le déploiement sur EC2 via SSM
    - |
      COMMAND_ID=$(aws ssm send-command \
        --region "$AWS_DEFAULT_REGION" \
        --instance-ids "$EC2_INSTANCE_ID" \
        --document-name "AWS-RunShellScript" \
        --comment "Deploy $CI_COMMIT_SHORT_SHA — $CI_COMMIT_TITLE" \
        --parameters "commands=[
          \"set -e\",
          \"aws s3 cp s3://$S3_BUCKET/deploy/frontend-dist.tar.gz /tmp/fd.tar.gz\",
          \"tar -xzf /tmp/fd.tar.gz -C /tmp/\",
          \"docker cp /tmp/frontend/dist/. petrix-frontend:/usr/share/nginx/html/\",
          \"aws s3 cp s3://$S3_BUCKET/deploy/scans.py /tmp/scans.py\",
          \"aws s3 cp s3://$S3_BUCKET/deploy/scan_tasks.py /tmp/scan_tasks.py\",
          \"aws s3 cp s3://$S3_BUCKET/deploy/agent_download.py /tmp/agent_download.py\",
          \"docker cp /tmp/scans.py petrix-backend:/app/app/api/v1/scans.py\",
          \"docker cp /tmp/agent_download.py petrix-backend:/app/app/api/v1/agent_download.py\",
          \"docker cp /tmp/scan_tasks.py petrix-backend:/app/app/workers/scan_tasks.py\",
          \"docker cp /tmp/scan_tasks.py petrix-celery:/app/app/workers/scan_tasks.py\",
          \"docker restart petrix-backend petrix-celery\",
          \"echo DEPLOY_OK\"
        ]" \
        --query 'Command.CommandId' --output text)
    - echo "SSM Command ID $COMMAND_ID"
    - sleep 25
    - |
      STATUS=$(aws ssm get-command-invocation \
        --region "$AWS_DEFAULT_REGION" \
        --command-id "$COMMAND_ID" \
        --instance-id "$EC2_INSTANCE_ID" \
        --query 'StatusDetails' --output text)
      echo "Status: $STATUS"
      aws ssm get-command-invocation \
        --region "$AWS_DEFAULT_REGION" \
        --command-id "$COMMAND_ID" \
        --instance-id "$EC2_INSTANCE_ID" \
        --query 'StandardOutputContent' --output text
      [ "$STATUS" = "Success" ] || exit 1
