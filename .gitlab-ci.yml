stages:
  - lint
  - test
  - build
  - deploy

variables:
  DATABASE_URL: "sqlite:///./test.db"
  SECRET_KEY: "ci-test-secret-key"
  ADMIN_PASSWORD: "CITestAdmin123!"

# ---------------------------------------------------------------------------
# LINT
# ---------------------------------------------------------------------------
backend-lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install ruff black
  script:
    - cd backend
    - ruff check app/
    - black --check app/

# ---------------------------------------------------------------------------
# TEST
# ---------------------------------------------------------------------------
backend-test:
  stage: test
  image: python:3.12-slim
  before_script:
    - cd backend
    - pip install -r requirements.txt pytest-cov
  script:
    - cd backend
    - pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml

frontend-test:
  stage: test
  image: node:20
  before_script:
    - cd frontend && npm ci
  script:
    - cd frontend && npm run test:coverage

# ---------------------------------------------------------------------------
# BUILD (validation only — images are built on EC2)
# ---------------------------------------------------------------------------
frontend-build:
  stage: build
  image: node:20
  before_script:
    - cd frontend && npm ci
  script:
    - cd frontend && npm run build
  artifacts:
    paths:
      - frontend/dist/

# ---------------------------------------------------------------------------
# DEPLOY — déclenché sur push vers main uniquement
# Utilise AWS SSM : aucun port ouvert, aucune clé SSH stockée dans GitLab
# EC2 reçoit la commande via l'API AWS et fait git pull + docker compose up
# ---------------------------------------------------------------------------
deploy-production:
  stage: deploy
  image: amazon/aws-cli:latest
  only:
    - main
  environment:
    name: production
    url: https://petrix.noellahome.org
  script:
    # Envoyer la commande de déploiement à EC2 via SSM (pas de SSH, pas de port ouvert)
    - |
      COMMAND_ID=$(aws ssm send-command \
        --region eu-west-1 \
        --instance-ids "$EC2_INSTANCE_ID" \
        --document-name "AWS-RunShellScript" \
        --comment "Deploy from GitLab CI - $CI_COMMIT_SHORT_SHA" \
        --parameters 'commands=[
          "set -e",
          "cd /home/ec2-user/petrix",
          "git pull origin main",
          "docker compose -f docker/docker-compose.prod.yml build",
          "docker compose -f docker/docker-compose.prod.yml up -d --remove-orphans",
          "docker compose -f docker/docker-compose.prod.yml ps"
        ]' \
        --query 'Command.CommandId' \
        --output text)
      echo "SSM Command ID: $COMMAND_ID"

    # Attendre que la commande se termine (max 10 min)
    - |
      aws ssm wait command-executed \
        --region eu-west-1 \
        --command-id "$COMMAND_ID" \
        --instance-id "$EC2_INSTANCE_ID"

    # Afficher le résultat
    - |
      aws ssm get-command-invocation \
        --region eu-west-1 \
        --command-id "$COMMAND_ID" \
        --instance-id "$EC2_INSTANCE_ID" \
        --query '[StatusDetails, StandardOutputContent]' \
        --output text

  # Variables GitLab CI/CD → Settings → CI/CD → Variables :
  # AWS_ACCESS_KEY_ID     — clé IAM (permission SSM + EC2)  [Masked]
  # AWS_SECRET_ACCESS_KEY — clé secrète IAM                 [Masked]
  # AWS_DEFAULT_REGION    — eu-west-1
  # EC2_INSTANCE_ID       — i-0fc0adfd256c0428d
