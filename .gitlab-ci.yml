stages:
  - lint
  - test
  - build
  - deploy

variables:
  DATABASE_URL: "sqlite:///./test.db"
  SECRET_KEY: "ci-test-secret-key"
  ADMIN_PASSWORD: "CITestAdmin123!"

# ---------------------------------------------------------------------------
# LINT
# ---------------------------------------------------------------------------
backend-lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install ruff black
  script:
    - cd backend
    - ruff check app/
    - black --check app/

# ---------------------------------------------------------------------------
# TEST
# ---------------------------------------------------------------------------
backend-test:
  stage: test
  image: python:3.12-slim
  before_script:
    - cd backend
    - pip install -r requirements.txt pytest-cov
  script:
    - cd backend
    - pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml

frontend-test:
  stage: test
  image: node:20
  before_script:
    - cd frontend && npm ci
  script:
    - cd frontend && npm run test:coverage

# ---------------------------------------------------------------------------
# BUILD (validation only — images are built on EC2)
# ---------------------------------------------------------------------------
frontend-build:
  stage: build
  image: node:20
  before_script:
    - cd frontend && npm ci
  script:
    - cd frontend && npm run build
  artifacts:
    paths:
      - frontend/dist/

# ---------------------------------------------------------------------------
# DEPLOY — déclenché sur push vers main uniquement
# Utilise EC2 Instance Connect : aucune clé privée stockée dans GitLab
# ---------------------------------------------------------------------------
deploy-production:
  stage: deploy
  image: python:3.12-slim
  only:
    - main
  environment:
    name: production
    url: https://petrix.noellahome.org
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client rsync curl
    - pip install -q awscli

    # Générer une clé SSH éphémère (valable 60s via EC2 Instance Connect)
    - ssh-keygen -t ed25519 -f ~/.ssh/ci_temp_key -N "" -q
    - echo "StrictHostKeyChecking no" > ~/.ssh/config

    # Ouvrir le port 22 depuis l'IP du runner
    - RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
    - |
      RULE_ID=$(aws --region eu-west-1 ec2 authorize-security-group-ingress \
        --group-id "$EC2_SG_ID" \
        --ip-permissions "[{\"IpProtocol\":\"tcp\",\"FromPort\":22,\"ToPort\":22,\"IpRanges\":[{\"CidrIp\":\"${RUNNER_IP}/32\",\"Description\":\"gitlab-ci-runner\"}]}]" \
        --query 'SecurityGroupRules[0].SecurityGroupRuleId' --output text 2>/dev/null || echo "already-open")
      echo "SG rule: $RULE_ID"
      export RUNNER_SG_RULE_ID="$RULE_ID"

    # Pousser la clé éphémère via EC2 Instance Connect (valide 60s)
    - |
      aws --region eu-west-1 ec2-instance-connect send-ssh-public-key \
        --instance-id "$EC2_INSTANCE_ID" \
        --instance-os-user "$EC2_USER" \
        --ssh-public-key file://~/.ssh/ci_temp_key.pub

  script:
    # Synchroniser le code (doit démarrer dans les 60s après send-ssh-public-key)
    - |
      rsync -az --delete \
        --exclude='.git' \
        --exclude='node_modules' \
        --exclude='__pycache__' \
        --exclude='*.pyc' \
        --exclude='.env' \
        --exclude='frontend/dist' \
        -e "ssh -i ~/.ssh/ci_temp_key" \
        . ${EC2_USER}@${EC2_HOST}:/home/ec2-user/petrix/

    # Rebuild + restart (nouvelle connexion = nouvelle clé éphémère)
    - |
      aws --region eu-west-1 ec2-instance-connect send-ssh-public-key \
        --instance-id "$EC2_INSTANCE_ID" \
        --instance-os-user "$EC2_USER" \
        --ssh-public-key file://~/.ssh/ci_temp_key.pub
    - |
      ssh -i ~/.ssh/ci_temp_key ${EC2_USER}@${EC2_HOST} '
        set -e
        cd /home/ec2-user/petrix
        docker compose -f docker/docker-compose.prod.yml build
        docker compose -f docker/docker-compose.prod.yml up -d --remove-orphans
        docker compose -f docker/docker-compose.prod.yml ps
      '

  after_script:
    # Fermer le port 22 dans tous les cas
    - |
      if [ -n "$RUNNER_SG_RULE_ID" ] && [ "$RUNNER_SG_RULE_ID" != "already-open" ]; then
        aws --region eu-west-1 ec2 revoke-security-group-ingress \
          --group-id "$EC2_SG_ID" \
          --security-group-rule-ids "$RUNNER_SG_RULE_ID"
        echo "Port 22 refermé"
      fi

  # Variables GitLab CI/CD → Settings → CI/CD → Variables (Protected + Masked) :
  # AWS_ACCESS_KEY_ID     — clé IAM (permission EC2 Instance Connect + SG)
  # AWS_SECRET_ACCESS_KEY — clé secrète IAM
  # AWS_DEFAULT_REGION    — eu-west-1
  # EC2_HOST              — 3.255.126.244
  # EC2_USER              — ec2-user
  # EC2_SG_ID             — sg-09896b73bb44d0ac3
  # EC2_INSTANCE_ID       — i-0fc0adfd256c0428d
