# Environnement de test isolé - ne partage pas les volumes avec dev/prod
# Usage: docker-compose -f docker-compose.test.yml up -d

services:
  # PostgreSQL Test Database
  db-test:
    image: postgres:16-alpine
    container_name: petrix-db-test
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-petrix_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-petrix_test}
    ports:
      - "5433:5432"  # Port différent pour éviter conflit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER:-petrix_test}"]
      interval: 3s
      timeout: 3s
      retries: 5
    # Pas de volume persistant - DB reset à chaque restart
    tmpfs:
      - /var/lib/postgresql/data

  # Redis Test
  redis-test:
    image: redis:7-alpine
    container_name: petrix-redis-test
    ports:
      - "6380:6379"  # Port différent
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  # Backend Test
  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: petrix-backend:latest
    container_name: petrix-backend-test
    environment:
      - DATABASE_URL=postgresql://${TEST_POSTGRES_USER:-petrix_test}:${TEST_POSTGRES_PASSWORD}@db-test:5432/${TEST_POSTGRES_DB:-petrix_test}
      - REDIS_URL=redis://redis-test:6379/0
      - SECRET_KEY=${TEST_SECRET_KEY:-changeme}
      - DEBUG=true
      - CORS_ORIGINS=http://localhost:5174,http://localhost:3001
      - ADMIN_EMAIL=test@petrix.local
      - ADMIN_PASSWORD=${TEST_ADMIN_PASSWORD}
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"  # Port différent
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend Test
  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: petrix-frontend:latest
    container_name: petrix-frontend-test
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5173"  # Port différent
    environment:
      - VITE_API_URL=http://localhost:8001
    depends_on:
      - backend-test
    command: npm run dev -- --host

  # Test Runner - exécute les tests puis s'arrête
  test-runner:
    image: petrix-backend:latest
    container_name: petrix-test-runner
    environment:
      - DATABASE_URL=postgresql://${TEST_POSTGRES_USER:-petrix_test}:${TEST_POSTGRES_PASSWORD}@db-test:5432/${TEST_POSTGRES_DB:-petrix_test}
      - REDIS_URL=redis://redis-test:6379/0
      - SECRET_KEY=${TEST_SECRET_KEY:-changeme}
      - TESTING=true
    volumes:
      - ./backend:/app
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command: pytest -v --tb=short
    profiles:
      - test  # Lancé uniquement avec --profile test

  # Seed Data - peuple la DB avec des données de test
  seed-data:
    image: petrix-backend:latest
    container_name: petrix-seed-data
    environment:
      - DATABASE_URL=postgresql://${TEST_POSTGRES_USER:-petrix_test}:${TEST_POSTGRES_PASSWORD}@db-test:5432/${TEST_POSTGRES_DB:-petrix_test}
      - REDIS_URL=redis://redis-test:6379/0
      - SECRET_KEY=${TEST_SECRET_KEY:-changeme}
    volumes:
      - ./backend:/app
    depends_on:
      db-test:
        condition: service_healthy
    command: python -m scripts.seed_test_data
    profiles:
      - seed  # Lancé uniquement avec --profile seed

networks:
  default:
    name: petrix-test-network
